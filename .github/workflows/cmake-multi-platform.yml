name: CMake on multiple platforms

# it is termorary, for check run error
on: [push, pull_request]
#on:
#    workflow_dispatch:

jobs:
  build:
    if: ${{ true && github.ref_type != 'tag' }} # set !true for disable
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
      # os: [ubuntu-latest, windows-latest, macos-latest, windows-11-arm, macos-26-intel, ubuntu-24.04-arm]               
        os: [ubuntu-24.04, windows-2025, macos-15, windows-11-arm, macos-15-intel, ubuntu-24.04-arm]               
        build_type: [Release]
        c_compiler: [clang]
        cpp_compiler: [clang++]

    steps:
    - uses: actions/checkout@v4 

    - name: Set reusable strings
      id: strings
      shell: bash
      
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"


    - name: Find VS Clang (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
        $arch = if ($env:RUNNER_ARCH -eq "ARM64") { "ARM64" } else { "x64" }
    
        # Check architecture-specific LLVM directory first, fallback to base Llvm\bin
        $llvmBin = Join-Path $vsPath "VC\Tools\Llvm\$arch\bin"
        if (-not (Test-Path "$llvmBin\clang.exe")) {
          $llvmBin = Join-Path $vsPath "VC\Tools\Llvm\bin"
        }
    
        # Convert backslashes to forward slashes for CMake compatibility
        $clangC = (Join-Path $llvmBin "clang.exe") -replace '\\', '/'
        $clangCxx = (Join-Path $llvmBin "clang++.exe") -replace '\\', '/'
    
        # Enable SSE4.2 (includes hardware CRC32) on x64 runners
        # $extraFlags = if ($env:RUNNER_ARCH -eq "X64") { "-msse4.2" } else { "" }
    
        Write-Host "Found Clang at: $clangC"
        "CC=$clangC" >> $env:GITHUB_ENV
        "CXX=$clangCxx" >> $env:GITHUB_ENV
        # "CFLAGS=$extraFlags" >> $env:GITHUB_ENV
        # "CXXFLAGS=$extraFlags" >> $env:GITHUB_ENV

    - name: Find Clang (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        # Resolve full paths to clang and clang++
        clangC=$(command -v clang)
        clangCxx=$(command -v clang++)

        # Fail early if clang is not installed on the runner
        if [ -z "$clangC" ] || [ -z "$clangCxx" ]; then
          echo "Error: clang or clang++ not found in PATH"
          exit 1
        fi

        echo "Found Clang at: $clangC"
        echo "CC=$clangC" >> "$GITHUB_ENV"
        echo "CXX=$clangCxx" >> "$GITHUB_ENV"

    - name: Configure CMake
      shell: bash
      run: >
        -DCMAKE_C_COMPILER="$CC"
        -DCMAKE_CXX_COMPILER="$CXX"
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -B ${{ steps.strings.outputs.build-output-dir }}
        -S ${{ github.workspace }}
        cmake -G "Ninja"

    - name: Build 
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} --target all  -j 8

    - name: RunTest
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} --target run_tests  -j 8

    - name: Upload zip 
      uses: actions/upload-artifact@v4
      with:
          name: firebird-snapshot-${{ matrix.os }}
          path: distr/firebird-*.snapshot-*.zip
