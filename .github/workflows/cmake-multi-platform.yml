name: CMake on multiple platforms

# it is termorary, for check run error
# on: [push, pull_request]
on:
    workflow_dispatch:

jobs:
  build:
    if: ${{ true && github.ref_type != 'tag' }} # set !true for disable
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
      # os: [ubuntu-latest, windows-latest, macos-latest, windows-11-arm, macos-26-intel, ubuntu-24.04-arm]               
        os: [ubuntu-24.04, windows-2025, macos-15, windows-11-arm, macos-15-intel, ubuntu-24.04-arm]               
        build_type: [Release]
        c_compiler: [clang]
        cpp_compiler: [clang++]

    steps:
    - uses: actions/checkout@v4 

    - name: Set reusable strings
      id: strings
      shell: bash
      
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake Windows X64
      if: runner.os == 'Windows'&& runner.arch == 'X64'   # workaround Github update to Visual Studio 18
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DCMAKE_C_COMPILER="C:/Program Files/Microsoft Visual Studio/18/Enterprise/VC/Tools/Llvm/x64/bin/clang.exe"
        -DCMAKE_CXX_COMPILER="C:/Program Files/Microsoft Visual Studio/18/Enterprise/VC/Tools/Llvm/x64/bin/clang++.exe"        
        -S ${{ github.workspace }}
        -G "Unix Makefiles"

    - name: Configure CMake Windows ARM64
      if: runner.os == 'Windows'&& runner.arch == 'ARM64'   # workaround Github update to Visual Studio 18 
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DCMAKE_C_COMPILER="C:/Program Files/Microsoft Visual Studio/18/Enterprise/VC/Tools/Llvm/ARM64/bin/clang.exe"
        -DCMAKE_CXX_COMPILER="C:/Program Files/Microsoft Visual Studio/18/Enterprise/VC/Tools/Llvm/ARM64/bin/clang++.exe"        
        -S ${{ github.workspace }}
        -G "Unix Makefiles"




    - name: Configure CMake !Windows
      if: runner.os != 'Windows'
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}
        -G "Unix Makefiles"

    - name: Build Windows
      if: runner.os == 'Windows' # workaround Github update to Visual Studio 18 / MSVC 14.52
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} --target all  -j 8 -- -Onone

    - name: Build !Windows
      if: runner.os != 'Windows'
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} --target all  -j 8

    - name: RunTest Windows
      if: runner.os == 'Windows'
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} --target run_tests  -j 8 -- -Onone

    - name: RunTest !Windows 
      if: runner.os != 'Windows'
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} --target run_tests  -j 8


    - name: Upload zip 
      uses: actions/upload-artifact@v4
      with:
          name: firebird-snapshot-${{ matrix.os }}
          path: distr/firebird-*.snapshot-*.zip
